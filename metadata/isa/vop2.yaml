    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1

v_add_nc_u32:
  encoding: vop2
  opcode: 37
  description: >
    Add two unsigned 32-bit integer inputs and store the result into a vector register.
    No carry-in or carry-out support

  notes:
    - Supports saturation (unsigned 32-bit integer domain)

  carry:
    in: false
    out: false

  operands:
    outputs:
      - vdst

    inputs:
      - src0
      - vsrc1

  syntax: "vdst, src0:m, vsrc1:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
      consumer: src0
    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1

v_and_b32:
  encoding: vop2
  opcode: 27
  description: >
    Calculate bitwise AND on two vector inputs and store the result into a vector register
  notes:
    - Input and output modifiers not supported

  carry:
    in: false
    out: false

  operands:
    outputs:
      - vdst

    inputs:
      - src0
      - vsrc1

  syntax: "vdst, src0:m, vsrc1:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
      consumer: src0
    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1

v_ashrrev_i32:
  encoding: vop2
  opcode: 26
  description: >
    Given a shift count in the first vector input, calculate the arithmetic shift right
    (preserving sign bit) of the second vector input and store the result into a vector
    register
  notes:
    - DPP operates on the shift count, not the data being shifted

  carry:
    in: false
    out: false

  operands:
    outputs:
      - vdst

    inputs:
      - src0
      - vsrc1

  syntax: "vdst, src0:m, vsrc1:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
      consumer: src0
    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1

v_cndmask_b32:
  encoding: vop2
  opcode: 1
  description: >
    Copy data from one of two inputs based on the per-lane condition code and store the result
    into a vector register
  notes:
    - V_CNDMASK_B32 is the "VOP2" form that uses VCC as the select. VCC counts as one SGPR read.
    - In VOP3 the VCC source may be a scalar GPR specified in S2
    - >
      Floating-point modifiers are valid for this instruction if S0 and S1 are 32-bit floating
      point values. This instruction is suitable for negating or taking the absolute value of
      a floating-point value

  carry:
    in: false
    out: false

  operands:
    outputs:
      - vdst

    inputs:
      - src0
      - vsrc1
      - vcc

  syntax: "vdst, src0:m, vsrc1:m, vcc:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
      consumer: src0
    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1

