v_max_num_f16:
  encoding: vop2
  opcode: 49
  description: >
    Select the IEEE maximumNumber() of two half-precision float inputs and store the result into a vector register.
    A numeric argument is favoured over NaN when determining which argument to return

  notes:
    - IEEE compliant. Supports denormals, round mode, exception flags, saturation
    - >
      Denorm flushing for this operation is effectively controlled by the input denorm mode control: If
      input denorm mode is disabling denorm, the internal result of a min/max operation cannot be a denorm
      value, so output denorm mode is irrelevant. If input denorm mode is enabling denorm, the internal
      min/max result can be a denorm and this operation outputs as a denorm regardless of output denorm mode

  operands:
    outputs:
      - vdst

    inputs:
      - src0
      - vsrc1

  special_state:
    reads: []
    writes: []

  syntax: "vdst, src0:m, vsrc1:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
      consumer: src0
    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1

