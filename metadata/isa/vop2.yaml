v_add_co_ci_u32:
  encoding: vop2
  opcode: 32
  description: Add two unsigned 32-bit integer inputs and a bit from a carry-in mask, store the result into a vector register and store the carry-out mask into a scalar register.
  notes:
    - >
      In VOP3 the VCC destination may be an arbitrary SGPR-pair, and the VCC source comes from the SGPR-pair at S2.u
    - Supports saturation (unsigned 32-bit integer domain)
  carry:
    in: true
    out: true

  operands:
    outputs:
      - vdst
      - sdst

    inputs:
      - src0
      - vsrc1
      - vcc

  syntax: "vdst, sdst, src0:m, vsrc1:m, vcc:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
      consumer: src1
    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1
    - name: sdst_to_vcc
      producer: sdst
      consumer: vcc

v_add_f16:
  encoding: vop2
  opcode: 50
  description: Add two floating point inputs and store the result into a vector register
  notes:
    - 0.5ULP precision. Supports denormals, round mode, exception flags and saturation

  carry:
    in: false
    out: false

  operands:
    outputs:
      - vdst

    inputs:
      - src0
      - vsrc1

  syntax: "vdst, src0:m, vsrc1:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
      consumer: src0
    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1

v_add_f32:
  encoding: vop2
  opcode: 3
  description: Add two floating point inputs and store the result into a vector register
  notes:
    - 0.5ULP precision, denormals are supported

  carry:
    in: false
    out: false

  operands:
    outputs:
      - vdst

    inputs:
      - src0
      - vsrc1

  syntax: "vdst, src0:m, vsrc1:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
      consumer: src0
    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1

v_add_f64:
  encoding: vop2
  opcode: 2
  description: Add two floating point inputs and store the result into a vector register
  notes:
    - 0.5ULP precision, denormals are supported

  carry:
    in: false
    out: false

  operands:
    outputs:
      - vdst

    inputs:
      - src0
      - vsrc1

  syntax: "vdst, src0:m, vsrc1:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
