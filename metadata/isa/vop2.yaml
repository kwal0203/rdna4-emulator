v_pk_fmac_f16:
  encoding: vop2
  opcode: 60
  description: >
    Multiply two packed half-precision float inputs component-wise and accumulate the result into the destination
    register using fused multiply add.

  notes:
    - VOP2 version of V_PK_FMA_F16 with third source VGPR address is the destination.

  operands:
    outputs:
      - vdst

    inputs:
      - src0
      - vsrc1
      - vdst

  special_state:
    reads: []
    writes: []

  syntax: "vdst, src0:m, vsrc1:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
      consumer: src0
    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1
    - name: vdst_to_vdst
      producer: vdst
      consumer: vdst

v_subrev_co_ci_u32:
  encoding: vop2
  opcode: 34
  description: >
    Subtract the first unsigned 32-bit integer input from the second input, subtract a bit from the carry-in mask,
    store the result into a vector register and store the carry-out mask into a scalar register.

  notes:
    - >
      In VOP3 the VCC destination may be an arbitrary SGPR-pair, and the VCC source comes from the SGPR-pair at
      S2.u.
    - Supports saturation (unsigned 32-bit integer domain).

  operands:
    outputs:
      - vdst
      - sdst

    inputs:
      - src0
      - vsrc1
      - vcc

  special_state:
    reads:
      - name: vcc
        role: carry_in
    writes:
      - name: sdst
        role: carry_out

  syntax: "vdst, sdst, src0:m, vsrc1:m, vcc:m"

  latency_paths:
    - name: vdst_to_src0
      producer: vdst
      consumer: src0
    - name: vdst_to_vsrc1
      producer: vdst
      consumer: vsrc1
    - name: sdst_to_vcc
      producer: sdst
      consumer: vcc

